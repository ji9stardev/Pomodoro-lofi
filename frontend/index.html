<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lo-Fi Pomodoro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="min-h-screen overflow-hidden transition-all duration-1000" id="app-body">

  <!-- BACKGROUND -->
  <div id="bg-layer" class="fixed inset-0 z-0 transition-all duration-1500">
    <div class="grain-overlay"></div>
    <div id="bg-tint" class="absolute inset-0 transition-all duration-1500"></div>
  </div>

  <!-- HEADER -->
  <header class="relative z-10 flex items-center justify-between px-6 py-4">
    <!-- Discord -->
    <div id="discord-section" class="flex items-center gap-3 glass-card px-4 py-2 rounded-2xl">
      <div id="discord-avatar-wrap" class="relative hidden">
        <img id="discord-avatar" src="" alt="Avatar" class="w-9 h-9 rounded-full border-2 border-white/30" />
        <span id="discord-status-dot" class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-black/40 bg-green-400"></span>
      </div>
      <div>
        <p id="discord-username" class="font-mono text-xs text-white/50">Sin conectar</p>
        <p id="discord-status-text" class="font-mono text-xs text-white/30">Discord</p>
      </div>
      <button id="discord-btn" onclick="handleDiscordLogin()" class="ml-2 text-xs glass-btn px-3 py-1 rounded-lg font-mono text-white/70 hover:text-white transition-colors">
        Conectar
      </button>
    </div>

    <!-- Clima + Hora -->
    <div class="flex items-center gap-3 glass-card px-4 py-2 rounded-2xl">
      <span id="weather-icon" class="text-2xl">🌤️</span>
      <div>
        <p id="weather-temp" class="font-mono text-sm text-white font-bold">--°C</p>
        <p id="weather-city" class="font-mono text-xs text-white/50">Tu Ciudad</p>
      </div>
      <div class="w-px h-8 bg-white/20 mx-1"></div>
      <div id="live-clock" class="font-mono text-lg text-white font-bold">00:00</div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="relative z-10 flex flex-col items-center justify-center min-h-[calc(100vh-180px)] gap-6">

    <!-- Tabs -->
    <div class="flex gap-3">
      <button id="tab-study" onclick="switchMode('study')" class="mode-tab active font-mono text-sm px-5 py-2 rounded-full transition-all">🍅 Estudio</button>
      <button id="tab-short" onclick="switchMode('short')" class="mode-tab font-mono text-sm px-5 py-2 rounded-full transition-all">☕ Descanso Corto</button>
      <button id="tab-long" onclick="switchMode('long')" class="mode-tab font-mono text-sm px-5 py-2 rounded-full transition-all">🌙 Descanso Largo</button>
    </div>

    <!-- Reloj -->
    <div class="timer-card glass-card rounded-3xl px-16 py-10 flex flex-col items-center gap-6">
      <div class="relative flex items-center justify-center" style="width:220px;height:220px;">
        <svg class="absolute inset-0 -rotate-90" width="220" height="220" viewBox="0 0 220 220">
          <circle cx="110" cy="110" r="100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>
          <circle id="progress-ring" cx="110" cy="110" r="100"
            fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="8"
            stroke-linecap="round" stroke-dasharray="628.3" stroke-dashoffset="0"
            style="transition: stroke-dashoffset 1s linear;"/>
        </svg>
        <div class="flex flex-col items-center">
          <span id="timer-display" class="timer-text text-white font-bold leading-none">25:00</span>
          <span id="mode-label" class="font-mono text-xs text-white/40 mt-2 uppercase tracking-widest">Estudio</span>
        </div>
      </div>

      <div class="flex gap-2" id="cycles-dots"></div>

      <div class="flex gap-4 items-center">
        <button onclick="resetTimer()" class="glass-btn w-10 h-10 rounded-full flex items-center justify-center text-white/60 hover:text-white transition-colors text-lg">↺</button>
        <button id="start-btn" onclick="toggleTimer()" class="start-btn glass-card px-10 py-3 rounded-full font-mono font-bold text-white text-lg tracking-wide hover:scale-105 active:scale-95 transition-all">Iniciar</button>
        <button onclick="openSettings()" class="glass-btn w-10 h-10 rounded-full flex items-center justify-center text-white/60 hover:text-white transition-colors text-lg">⚙</button>
      </div>
    </div>

    <!-- Estadísticas -->
    <div class="flex gap-4">
      <div class="glass-card rounded-2xl px-6 py-4 text-center">
        <p class="font-mono text-3xl font-bold text-white" id="stat-hours">0.00</p>
        <p class="font-mono text-xs text-white/40 mt-1 uppercase tracking-widest">Horas Hoy</p>
      </div>
      <div class="glass-card rounded-2xl px-6 py-4 text-center">
        <p class="font-mono text-3xl font-bold text-white" id="stat-cycles">0</p>
        <p class="font-mono text-xs text-white/40 mt-1 uppercase tracking-widest">Ciclos</p>
      </div>
      <div class="glass-card rounded-2xl px-6 py-4 text-center">
        <p class="font-mono text-3xl font-bold text-white" id="stat-streak">0</p>
        <p class="font-mono text-xs text-white/40 mt-1 uppercase tracking-widest">Racha</p>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="relative z-10 flex items-center justify-center px-6 py-4 gap-4">
    <!-- Botón Temas -->
    <button onclick="openThemes()" class="glass-card px-5 py-2 rounded-2xl font-mono text-sm text-white/70 hover:text-white transition-colors flex items-center gap-2">
      🎨 Temas
    </button>
    <div class="glass-card px-4 py-2 rounded-2xl">
      <p class="font-mono text-xs text-white/30">Desarrollado Por Ji9dev</p>
    </div>
  </footer>

  <!-- OVERLAY Configuración -->
  <div id="settings-overlay" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm">
    <div class="glass-card rounded-3xl p-8 w-full max-w-md mx-4 relative">
      <button onclick="closeSettings()" class="absolute top-4 right-4 text-white/40 hover:text-white text-2xl transition-colors">✕</button>
      <h2 class="font-display text-2xl font-bold text-white mb-6">Configuración</h2>
      <div class="flex flex-col gap-5">
        <div class="setting-row">
          <label class="font-mono text-sm text-white/60 uppercase tracking-widest">🍅 Tiempo de Estudio (min)</label>
          <div class="flex items-center gap-3 mt-2">
            <input type="range" id="cfg-study" min="1" max="60" value="25" class="flex-1 accent-white" oninput="updateLabel('cfg-study','lbl-study')"/>
            <span id="lbl-study" class="font-mono text-white font-bold w-8 text-right">25</span>
          </div>
        </div>
        <div class="setting-row">
          <label class="font-mono text-sm text-white/60 uppercase tracking-widest">☕ Descanso Corto (min)</label>
          <div class="flex items-center gap-3 mt-2">
            <input type="range" id="cfg-short" min="1" max="30" value="5" class="flex-1 accent-white" oninput="updateLabel('cfg-short','lbl-short')"/>
            <span id="lbl-short" class="font-mono text-white font-bold w-8 text-right">5</span>
          </div>
        </div>
        <div class="setting-row">
          <label class="font-mono text-sm text-white/60 uppercase tracking-widest">🌙 Descanso Largo (min)</label>
          <div class="flex items-center gap-3 mt-2">
            <input type="range" id="cfg-long" min="5" max="60" value="15" class="flex-1 accent-white" oninput="updateLabel('cfg-long','lbl-long')"/>
            <span id="lbl-long" class="font-mono text-white font-bold w-8 text-right">15</span>
          </div>
        </div>
        <div class="setting-row">
          <label class="font-mono text-sm text-white/60 uppercase tracking-widest">🔄 Ciclos antes de Descanso Largo</label>
          <div class="flex items-center gap-3 mt-2">
            <input type="range" id="cfg-cycles" min="2" max="8" value="4" class="flex-1 accent-white" oninput="updateLabel('cfg-cycles','lbl-cycles')"/>
            <span id="lbl-cycles" class="font-mono text-white font-bold w-8 text-right">4</span>
          </div>
        </div>
        <button onclick="applySettings()" class="mt-2 start-btn glass-card py-3 rounded-full font-mono font-bold text-white tracking-wide hover:scale-105 active:scale-95 transition-all">Aplicar Cambios</button>
        <button onclick="resetTodayStats()" class="glass-btn py-2 rounded-full font-mono text-xs text-white/30 hover:text-red-400 transition-colors">↺ Reiniciar estadísticas de hoy</button>
      </div>
    </div>
  </div>

  <!-- OVERLAY Temas -->
  <div id="themes-overlay" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm">
    <div class="glass-card rounded-3xl p-8 w-full max-w-2xl mx-4 relative">
      <button onclick="closeThemes()" class="absolute top-4 right-4 text-white/40 hover:text-white text-2xl transition-colors">✕</button>
      <h2 class="font-display text-2xl font-bold text-white mb-2">🎨 Temas</h2>
      <p class="font-mono text-xs text-white/40 mb-6">Elige un tema para personalizar tu experiencia</p>
      <div class="grid grid-cols-3 gap-3">
        <button onclick="applyTheme('dark_landscape')" class="theme-btn rounded-2xl p-4 text-left" style="background:linear-gradient(135deg,#0d0d0d,#1a2a1a)">
          <span class="text-2xl">🌲</span><p class="font-mono text-xs text-white mt-2 font-bold">Paisaje Oscuro</p><p class="font-mono text-xs text-white/40">Bosque nocturno</p>
        </button>
        <button onclick="applyTheme('pink_dream')" class="theme-btn rounded-2xl p-4 text-left" style="background:linear-gradient(135deg,#ff6b9d,#c44db5)">
          <span class="text-2xl">🌸</span><p class="font-mono text-xs text-white mt-2 font-bold">Sueño Rosa</p><p class="font-mono text-xs text-white/40">Flores y nubes</p>
        </button>
        <button onclick="applyTheme('purple_galaxy')" class="theme-btn rounded-2xl p-4 text-left" style="background:linear-gradient(135deg,#4a0080,#1a0040)">
          <span class="text-2xl">🌌</span><p class="font-mono text-xs text-white mt-2 font-bold">Galaxia Morada</p><p class="font-mono text-xs text-white/40">Cosmos profundo</p>
        </button>
        <button onclick="applyTheme('ocean_night')" class="theme-btn rounded-2xl p-4 text-left" style="background:linear-gradient(135deg,#001a33,#003366)">
          <span class="text-2xl">🌊</span><p class="font-mono text-xs text-white mt-2 font-bold">Océano Nocturno</p><p class="font-mono text-xs text-white/40">Mar profundo</p>
        </button>
        <button onclick="applyTheme('sunset_warm')" class="theme-btn rounded-2xl p-4 text-left" style="background:linear-gradient(135deg,#ff6b35,#f7931e)">
          <span class="text-2xl">🌅</span><p class="font-mono text-xs text-white mt-2 font-bold">Atardecer Cálido</p><p class="font-mono text-xs text-white/40">Tonos naranja</p>
        </button>
        <button onclick="applyTheme('mint_forest')" class="theme-btn rounded-2xl p-4 text-left" style="background:linear-gradient(135deg,#00b09b,#096644)">
          <span class="text-2xl">🍃</span><p class="font-mono text-xs text-white mt-2 font-bold">Bosque Menta</p><p class="font-mono text-xs text-white/40">Verde esmeralda</p>
        </button>
        <button onclick="applyTheme('rainy_city')" class="theme-btn rounded-2xl p-4 text-left" style="background:linear-gradient(135deg,#2c3e50,#4a6274)">
          <span class="text-2xl">🌧️</span><p class="font-mono text-xs text-white mt-2 font-bold">Ciudad Lluviosa</p><p class="font-mono text-xs text-white/40">Gris urbano</p>
        </button>
        <button onclick="applyTheme('cherry_blossom')" class="theme-btn rounded-2xl p-4 text-left" style="background:linear-gradient(135deg,#ffb7c5,#d4547a)">
          <span class="text-2xl">🌺</span><p class="font-mono text-xs text-white mt-2 font-bold">Cerezo en Flor</p><p class="font-mono text-xs text-white/40">Rosa japonés</p>
        </button>
        <button onclick="applyTheme('auto')" class="theme-btn rounded-2xl p-4 text-left" style="background:linear-gradient(135deg,#667eea,#764ba2)">
          <span class="text-2xl">🌍</span><p class="font-mono text-xs text-white mt-2 font-bold">Auto (Clima)</p><p class="font-mono text-xs text-white/40">Según tu ciudad</p>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 glass-card px-6 py-3 rounded-full font-mono text-sm text-white hidden">✓</div>

  <script src="/static/app.js"></script>
</body>
</html>
