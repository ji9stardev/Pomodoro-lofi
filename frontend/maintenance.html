<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mantenimiento — Lo-Fi Pomodoro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Space Mono', monospace; background: linear-gradient(135deg, #1a0040 0%, #0d001a 50%, #000510 100%); }
    .glass { background: rgba(255,255,255,0.08); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.15); }
    .grain { position: fixed; inset: 0; opacity: 0.3; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
      mix-blend-mode: overlay; }
    @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 8s linear infinite; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center">
  <div class="grain"></div>

  <div class="glass rounded-3xl p-12 max-w-lg w-full mx-4 text-center relative">
    <!-- Icono animado -->
    <div class="text-7xl mb-6 spin inline-block">⚙️</div>

    <h1 style="font-family:'Syne',sans-serif" class="text-3xl font-extrabold text-white mb-3">
      En Mantenimiento
    </h1>

    <p class="text-white/50 text-sm mb-8 leading-relaxed">
      Estamos mejorando la app para darte una mejor experiencia.<br/>
      Volvemos pronto. 🍅
    </p>

    <!-- Barra de progreso animada -->
    <div class="w-full bg-white/10 rounded-full h-1.5 mb-8 overflow-hidden">
      <div class="h-full bg-white/60 rounded-full pulse" style="width: 65%;"></div>
    </div>

    <!-- Info de contacto opcional -->
    <p class="text-white/30 text-xs">
      ¿Preguntas? Escríbenos en Discord
    </p>

    <!-- Hora estimada (editable) -->
    <div class="mt-6 glass rounded-2xl px-6 py-3 inline-block">
      <p class="text-white/40 text-xs uppercase tracking-widest mb-1">Regreso estimado</p>
      <p id="eta" class="text-white font-bold text-sm">en 10 minutos</p>
    </div>
  </div>
</body>
</html>
